<!doctype html>
<html lang="zh-CN" data-mode="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小猫寻鱼</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=adventure1">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true"><div class="logo-face"></div><div class="logo-ear left"></div><div class="logo-ear right"></div></div><div class="brand-text"><div class="eyebrow">三幕池塘冒险</div><h1>小猫寻鱼</h1></div></div>
    <div class="game-actions">
      <button class="btn" id="btnFullscreen" type="button" hidden>全屏</button>
      <button class="btn" id="btnPause" type="button" hidden>暂停</button>
    </div>
    <div class="hud" id="hud" hidden>
      <div class="pill pill-score">
        <span class="vbadge" id="hudVersion">V1</span><span>饱腹度</span>
        <progress id="hudFullness" value="0" max="6" aria-label="饱腹进度"></progress>
        <span><strong id="hudScore">0</strong><span id="hudScoreUnit"> / 6</span></span>
      </div>
      <div class="pill pill-time" id="pillTime" hidden><span class="dot"></span><strong id="hudTime"></strong><span class="unit">秒</span></div>
      <div id="fishLegend" class="fish-legend" hidden>
        <span><i class="fish-key ordinary" aria-hidden="true"></i>普通鱼 +1</span>
        <span><i class="fish-key golden" aria-hidden="true">★</i>金鱼 +3</span>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="game" tabindex="-1" width="768" height="528" aria-label="小猫寻鱼游戏画面"></canvas>

    <div class="overlay show" id="overlayMenu">
      <div class="panel menu-panel adventure-menu">
        <p class="chapter-label">三幕池塘冒险</p>
        <div class="adventure-emblem" aria-hidden="true">✦ <span>🐈</span> ✦</div>
        <h2>小猫寻鱼</h2>
        <p class="adventure-lede">趁月亮升起前，捡够鱼，<br>点亮三盏灯笼，坐船回家。</p>
        <div id="journeyLights" class="journey-lights"></div>
        <button class="btn btn-primary" id="beginAdventure" type="button">开始冒险</button>
        <p class="hint">右下角摇杆移动 · 电脑也可用方向键</p>
      </div>
    </div>

    <div class="overlay" id="overlayBrief">
      <div class="panel brief-panel">
        <p class="chapter-label" id="storyTag"></p>
        <h2 id="briefTitle"></h2>
        <p id="briefGoal" class="brief-goal"></p>
        <ul id="briefRules" class="brief-rules"></ul>
        <div class="panel-actions">
          <button class="btn btn-primary" id="btnStart" type="button">开始</button>
          <button class="btn" id="btnBriefMenu" type="button">回到起点</button>
        </div>
        <p class="hint">拖动右下角的摇杆移动，松手后走完当前一格就停。</p>
      </div>
    </div>

    <div class="overlay" id="overlayPause">
      <div class="panel small-panel">
        <h3>已暂停</h3>
        <div class="panel-actions">
          <button class="btn btn-primary" id="btnResume" type="button">继续</button>
          <button class="btn" id="btnPauseRestart" type="button">重来</button>
          <button class="btn" id="btnPauseMenu" type="button">回到起点</button>
          <button class="btn btn-ghost" id="btnSound" type="button">音效 开</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlayResult">
      <div class="panel small-panel">
        <div class="result-head">
          <div class="result-mark" id="resultMark" aria-hidden="true"></div>
          <div><h3 id="resultTitle"></h3><p id="resultSub" class="muted"></p></div>
        </div>
        <div id="journeyStats" class="journey-stats" hidden></div>
        <div class="panel-actions">
          <button class="btn btn-primary" id="btnNext" type="button" hidden>下一关</button>
          <button class="btn" id="btnRetry" type="button">再试一次</button>
          <button class="btn" id="btnOtherVersion" type="button">换一关</button>
        </div>
      </div>
    </div>

    <p id="journeyGoal" class="journey-goal" hidden></p>
    <div class="toast" id="toast" role="status"></div>
  </main>
  <div id="joystick" class="joystick" role="group" aria-label="移动摇杆：向上、下、左、右拖动，松手停止">
    <div class="stick-ring" aria-hidden="true">
      <i class="stick-mark north"></i><i class="stick-mark east"></i>
      <i class="stick-mark south"></i><i class="stick-mark west"></i>
      <span id="stickThumb" class="stick-thumb">🐾</span>
    </div>
  </div>
</div>
<script src="game.js?v=adventure1"></script>
</body>
</html>
